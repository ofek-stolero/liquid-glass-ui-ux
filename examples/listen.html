<title>Glass Listen</title>
<style>/* liquid-glass-gl.css — companion to liquid-glass-gl.js. Glass content reads --lg-ink set by the renderer. */
[data-gl]{ color: var(--lg-ink, #fff); }
[data-gl] .lg-ink-2{ color: var(--lg-ink-2, rgb(255 255 255 / .74)); }
/* No WebGL2: the backdrop canvas is shown directly and glass falls back to a clear, lightly frosted surface. */
html.lg-no-webgl [data-gl]{ background: rgb(255 255 255 / .12); -webkit-backdrop-filter: blur(6px) saturate(1.2); backdrop-filter: blur(6px) saturate(1.2); box-shadow: inset 0 0 0 1px rgb(255 255 255 / .22); }
html.lg-no-webgl [data-gl][data-role="surface"]{ background: rgb(20 22 26 / .7); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); }
@media (prefers-reduced-transparency: reduce){ html.lg-no-webgl [data-gl]{ background: rgb(28 30 34 / .94); -webkit-backdrop-filter: none; backdrop-filter: none; } }
[data-gl]:focus-visible, [data-gl] :focus-visible{ outline: 3px solid #8ec1ff; outline-offset: 2px; }
</style>

<style>

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{color-scheme:dark}

body{font:16px/1.35 -apple-system,"SF Pro Text",system-ui,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;min-height:2600px}
canvas.view{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;touch-action:manipulation}
.i{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

.plus .ico{position:absolute;right:12px;top:12px}
.menu{position:absolute;inset:0;padding:14px 8px 8px;opacity:0;pointer-events:none;display:grid;align-content:start;gap:2px}
.menu b{font-size:13px;color:var(--ink2);font-weight:600;padding:0 12px 6px}
.menu button{display:flex;align-items:center;gap:12px;height:44px;padding:0 12px;border-radius:14px;font-weight:600;text-align:left;white-space:nowrap}
.menu button:active{background:rgb(255 255 255 / .12)}
.mini{position:fixed;z-index:5;left:0;right:0;margin:0 auto;width:var(--barw);bottom:calc(88px + env(safe-area-inset-bottom,0px));height:62px;border-radius:31px;display:flex;align-items:center;gap:12px;padding:0 10px 0 9px}

.mini .pp{width:44px;height:44px;border-radius:22px;display:grid;place-items:center}
.tabs{position:fixed;z-index:5;left:0;right:0;margin:0 auto;width:var(--barw);bottom:calc(14px + env(safe-area-inset-bottom,0px));height:64px;border-radius:32px;display:flex;padding:4px;touch-action:none}
.tab{position:relative;z-index:1;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:10.5px;font-weight:650;border-radius:28px;color:var(--t2,var(--ink2))}
.tab[aria-current]{color:var(--t1,#fff)}
.tab .i{transition:none}
.restsel{position:absolute;z-index:0;top:4px;bottom:4px;border-radius:28px;background:var(--sel);pointer-events:none}
.lens{position:absolute;z-index:0;pointer-events:none}
.hint{position:fixed;z-index:4;left:16px;right:16px;bottom:calc(160px + env(safe-area-inset-bottom,0px));text-align:center;font-size:12px;color:#ffffffb0;pointer-events:none;transition:opacity .6s}

    accessory: { thick: 14, dim: .28, frost: 2.5, refr: .42, disp: 0,   mag: 1,    press: 0,  glow: 0, layer: 0, rimDark: 0 },   // now playing: light text help
