<title>Glass Music</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* liquid-glass-gl.css — companion to liquid-glass-gl.js. Glass content reads --lg-ink set by the renderer. */
[data-gl]{ color: var(--lg-ink, #fff); }
[data-gl] .lg-ink-2{ color: var(--lg-ink-2, rgb(255 255 255 / .74)); }
/* No WebGL2: the backdrop canvas is shown directly and glass falls back to a clear, lightly frosted surface. */
html.lg-no-webgl [data-gl]{ background: rgb(255 255 255 / .12); -webkit-backdrop-filter: blur(6px) saturate(1.2); backdrop-filter: blur(6px) saturate(1.2); box-shadow: inset 0 0 0 1px rgb(255 255 255 / .22); }
html.lg-no-webgl [data-gl][data-role="surface"]{ background: rgb(20 22 26 / .7); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); }
@media (prefers-reduced-transparency: reduce){ html.lg-no-webgl [data-gl]{ background: rgb(28 30 34 / .94); -webkit-backdrop-filter: none; backdrop-filter: none; } }
[data-gl]:focus-visible, [data-gl] :focus-visible{ outline: 3px solid #8ec1ff; outline-offset: 2px; }

/* liquid-ux.css — companion to liquid-ux.js. Tokens can be overridden per app. */
:root{
  --lux-ink: #f3f5fa; --lux-ink-2: rgb(243 245 250 / .72);
  --lux-sheet-bg: rgb(24 26 31 / .86);       /* used when the optical glass renderer is absent */
  --lux-sheet-bg-full: rgb(24 26 31 / .97);
  --lux-sk: rgb(255 255 255 / .09);          /* skeleton tone: one step from the surface, never a gradient shimmer */
  --lux-sk-2: rgb(255 255 255 / .15);
  --lux-accent: #0a84ff; --lux-danger: #ff453a;
  --lux-radius-sheet: 34px;
}
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]){ --lux-ink:#111316; --lux-ink-2:rgb(17 19 22 / .66); --lux-sheet-bg: rgb(246 246 248 / .86); --lux-sheet-bg-full: rgb(246 246 248 / .97); --lux-sk: rgb(0 0 0 / .07); --lux-sk-2: rgb(0 0 0 / .12); } }

/* ---------- press feedback: highlight on touch-down, spring back on release ---------- */
.lux :where([data-press], button, a[href], [role="button"], [role="tab"], [role="menuitem"], [role="switch"], summary){ transition: scale .45s cubic-bezier(.2,.9,.3,1.18), opacity .2s ease, background-color .2s ease; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
.lux :where([data-pressed]):not([data-gl]){ scale: .965; opacity: .82; transition-duration: .08s, .08s, .08s; transition-timing-function: ease-out; }
.lux :where([data-press="row"][data-pressed]){ scale: 1; opacity: 1; background-color: rgb(127 127 127 / .14); }
@media (hover: hover) and (pointer: fine){ .lux :where([data-press], button, [role="button"]):hover{ opacity: .92; } }
@media (prefers-reduced-motion: reduce){ .lux :where([data-pressed]){ scale: 1; } .lux :where([data-press], button, a[href], [role="button"]){ transition: opacity .15s ease; } }

/* ---------- sheet ---------- */
.lux-backdrop{ position: fixed; inset: 0; z-index: 60; background: #000; opacity: 0; }
.lux-sheet{ position: fixed; z-index: 61; left: 8px; right: 8px; top: 0; border-radius: var(--lux-radius-sheet); color: var(--lux-ink); display: flex; flex-direction: column; overflow: hidden; touch-action: none; will-change: translate;
  background: color-mix(in srgb, var(--lux-sheet-bg) calc((1 - var(--lux-full, 0)) * 100%), var(--lux-sheet-bg-full)); }
html:not(.lg-no-webgl) .lux-sheet[data-gl]{ background: transparent; }      /* the optical renderer paints the glass */
.lux-sheet-wide{ left: 50%; right: auto; width: min(560px, calc(100vw - 32px)); }
.lux-grab{ width: 40px; height: 5px; border-radius: 3px; background: var(--lux-ink-2); margin: 8px auto 2px; flex: none; position: relative; cursor: grab; }
.lux-grab::before{ content: ""; position: absolute; inset: -14px -30px; }
.lux-sheet-h{ display: flex; align-items: center; gap: 12px; padding: 6px 14px 8px 20px; flex: none; }
.lux-sheet-t{ flex: 1; margin: 0; font-size: 20px; font-weight: 700; letter-spacing: -.01em; text-wrap: balance; }
.lux-close{ width: 44px; height: 44px; border-radius: 22px; display: grid; place-items: center; background: rgb(127 127 127 / .2); color: inherit; border: 0; flex: none; }
.lux-sheet-b{ flex: 1; overflow-y: auto; overscroll-behavior: contain; padding: 4px 20px calc(28px + env(safe-area-inset-bottom, 0px)); touch-action: pan-y; }
[data-lux-page]{ transform-origin: 50% 0; transition: none; }

/* ---------- skeleton: shapes that match the content they stand for ---------- */
.lux-sk{ display: block; background: var(--lux-sk); border-radius: 8px; animation: lux-pulse 1.6s ease-in-out infinite alternate; }
.lux-sk-line{ height: 14px; margin: 10px 0; border-radius: 7px; }
.lux-sk-row{ display: flex; align-items: center; gap: 14px; padding: 10px 0; }
.lux-sk-col{ flex: 1; }
@keyframes lux-pulse{ from{ background: var(--lux-sk); } to{ background: var(--lux-sk-2); } }
@media (prefers-reduced-motion: reduce){ .lux-sk{ animation: none; } }
.lux-error{ color: var(--lux-ink-2); }

/* ---------- pull to refresh: the activity indicator appears as you pull, spins while loading ---------- */
.lux-refresh{ position: fixed; left: 50%; top: calc(14px + env(safe-area-inset-top, 0px)); z-index: 4; width: 28px; height: 28px; margin-left: -14px; opacity: 0; pointer-events: none; }
.lux-refresh i{ position: absolute; left: 12.5px; top: 0; width: 3px; height: 8px; border-radius: 2px; background: var(--lux-ink); transform-origin: 1.5px 14px; opacity: calc(var(--p, 0) * .9); }
.lux-refresh i:nth-child(1){ rotate: 0deg } .lux-refresh i:nth-child(2){ rotate: 45deg } .lux-refresh i:nth-child(3){ rotate: 90deg } .lux-refresh i:nth-child(4){ rotate: 135deg }
.lux-refresh i:nth-child(5){ rotate: 180deg } .lux-refresh i:nth-child(6){ rotate: 225deg } .lux-refresh i:nth-child(7){ rotate: 270deg } .lux-refresh i:nth-child(8){ rotate: 315deg }
.lux-refresh[data-spin]{ animation: lux-spin .9s steps(8) infinite; }
@keyframes lux-spin{ to{ rotate: 360deg; } }

/* ---------- swipe actions ---------- */
.lux-swipe{ position: relative; overflow: hidden; touch-action: pan-y; }
.lux-swipe > :first-child{ position: relative; z-index: 1; will-change: translate; }
.lux-swipe-acts{ position: absolute; inset: 0 0 0 auto; display: flex; z-index: 0; width: var(--w, 0px); justify-content: flex-end; overflow: hidden; }
.lux-swipe-acts button{ min-width: 74px; border: 0; color: #fff; background: #636366; font-weight: 650; }
.lux-swipe-acts .lux-destructive{ background: var(--lux-danger); }

/* ---------- context menu ---------- */
.lux-ctx-layer{ position: fixed; inset: 0; z-index: 70; background: rgb(0 0 0 / .28); }
.lux-ctx{ position: fixed; min-width: 230px; padding: 6px; border-radius: 22px; display: grid; gap: 2px; color: var(--lux-ink); background: var(--lux-sheet-bg); }
html:not(.lg-no-webgl) .lux-ctx[data-gl]{ background: transparent; }
.lux-ctx button{ display: flex; justify-content: space-between; align-items: center; gap: 16px; min-height: 44px; padding: 0 14px; border: 0; border-radius: 16px; background: none; color: inherit; font: inherit; font-weight: 560; text-align: left; }
.lux-ctx .lux-destructive{ color: var(--lux-danger); }
.lux-lifted{ position: relative; z-index: 71; }

/* ---------- toast ---------- */
.lux-toast{ position: fixed; z-index: 80; left: 50%; translate: -50% 0; bottom: calc(170px + env(safe-area-inset-bottom, 0px)); display: flex; align-items: center; gap: 16px; padding: 10px 10px 10px 20px; min-height: 52px; border-radius: 26px; color: var(--lux-ink); background: var(--lux-sheet-bg); font-weight: 600; max-width: calc(100vw - 32px); }
html:not(.lg-no-webgl) .lux-toast[data-gl]{ background: transparent; }
.lux-toast button{ height: 36px; padding: 0 16px; border-radius: 18px; border: 0; background: rgb(127 127 127 / .25); color: inherit; font: inherit; font-weight: 700; }

/* glass shapes are squashed by the renderer; while a sheet is up, controls behind it recede */
html.lux-sheet-open [data-gl]:not(.lux-sheet):not(.lux-ctx):not(.lux-toast){ opacity: .5; transition: opacity .3s; }
[data-lux-covered]{ opacity: 0 !important; pointer-events: none; transition: opacity .12s; }

/* =============================== idiom tokens (HIG Typography + Buttons + Accessibility, 2026) =============================== */
/* iPhone/iPad: Body 17pt/22, Large Title 34pt bold, Headline 17 semibold, Footnote 13; targets 44pt.
   Mac: Body 13pt/16, Large Title 26pt, Headline 13 bold, Title 3 15; controls 28pt (min 20); rows 24–32pt. */
:root{ --lux-body: 17px; --lux-lh: 22px; --lux-title: 34px; --lux-headline: 17px; --lux-foot: 13px; --lux-target: 44px; --lux-row: 52px; --lux-control: 44px; }
:root[data-idiom="mac"]{ --lux-body: 13px; --lux-lh: 16px; --lux-title: 26px; --lux-headline: 13px; --lux-foot: 11px; --lux-target: 28px; --lux-row: 30px; --lux-control: 28px; }
/* Mac: clicking does not squash; the pressed state darkens slightly, and hover shows a quiet highlight */
:root[data-idiom="mac"].lux :where([data-pressed]):not([data-gl]){ scale: 1; opacity: .7; }
:root[data-idiom="mac"] .lux-ctx-mac{ background: transparent; }
:root[data-idiom="mac"] .lux-ctx{ min-width: 200px; padding: 5px; border-radius: 12px; }
:root[data-idiom="mac"] .lux-ctx:not([data-gl]){ background: rgb(40 42 48 / .82); -webkit-backdrop-filter: blur(24px) saturate(1.6); backdrop-filter: blur(24px) saturate(1.6); box-shadow: inset 0 0 0 .5px rgb(255 255 255 / .16); }
:root[data-idiom="mac"] .lux-ctx button{ min-height: 24px; border-radius: 6px; font-size: 13px; padding: 0 10px; }
:root[data-idiom="mac"] .lux-ctx button:hover, :root[data-idiom="mac"] .lux-ctx button:focus-visible{ background: var(--lux-accent); color: #fff; outline: none; }
/* Mac / iPad sheets: centred card; Mac puts its buttons at the bottom trailing edge */
.lux-sheet[data-idiom="mac"], .lux-sheet[data-idiom="tablet"]{ left: 50%; right: auto; width: min(560px, calc(100vw - 32px)); border-radius: 22px; }
.lux-sheet-f{ display: flex; justify-content: flex-end; gap: 8px; padding: 12px 16px 16px; flex: none; }
.lux-sheet-f button{ min-height: 28px; padding: 0 16px; border-radius: 14px; border: 0; background: rgb(127 127 127 / .22); color: inherit; font: inherit; font-size: 13px; font-weight: 600; }
.lux-sheet-f .lux-primary{ background: var(--lux-accent); color: #fff; }
.lux-sr{ position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

:root{ --ground:#121317; --ink:#f4f6fb; --ink2:#a3abbb; --accent:#fa2d48; --sideW:232px; --barH:52px; }
*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent }
html{ color-scheme:dark }
html,body{ margin:0; background:var(--ground); color:var(--ink) }
body{ font:var(--lux-body)/var(--lux-lh) -apple-system,"SF Pro Text",system-ui,"Segoe UI",sans-serif; -webkit-font-smoothing:antialiased }
button,input{ font:inherit; color:inherit }
button{ border:0; background:none; padding:0; cursor:pointer }
.i{ width:22px; height:22px; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; flex:none }
:root[data-idiom="mac"] .i{ width:16px; height:16px; stroke-width:1.8 }
/* ---------- content layer (DOM hit targets over the drawn feed; text the canvas draws is mirrored in aria labels) ---------- */
#scrollc{ position:relative; z-index:1 }
#tiles{ position:relative }
.tile{ position:absolute; border-radius:16px; outline-offset:3px }
#detail{ position:relative; display:none; padding:0 max(16px,env(safe-area-inset-right,0px)) 160px max(16px,env(safe-area-inset-left,0px)) }
.d-head{ display:flex; gap:22px; align-items:flex-end; margin:0 0 18px }
.d-head canvas{ width:150px; height:150px; border-radius:14px; flex:none }
.d-head h2{ margin:0; font-size:var(--lux-title); line-height:1.08; letter-spacing:-.02em; font-weight:800; text-wrap:balance }
.d-head p{ margin:4px 0 0; color:var(--accent); font-size:var(--lux-headline); font-weight:600 }
.d-head small{ display:block; color:var(--ink2); margin-top:4px; font-size:var(--lux-foot) }
.d-act{ display:flex; gap:10px; margin:0 0 18px }
.d-act button{ min-height:var(--lux-control); padding:0 22px; border-radius:calc(var(--lux-control)/2); font-weight:650; background:rgb(255 255 255 / .1); display:inline-flex; align-items:center; gap:8px; color:var(--accent) }
.d-act .play{ background:var(--accent); color:#fff }
.rows{ display:grid }
.row{ position:relative; border-radius:12px }
.row .lux-swipe-in{ display:flex; align-items:center; gap:14px; min-height:var(--lux-row); padding:0 8px 0 10px; border-radius:12px }   /* transparent: the actions sit outside it until swiped */
.row .t{ flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
.row .d{ color:var(--ink2); font-variant-numeric:tabular-nums; font-size:var(--lux-foot) }
.row .more{ width:var(--lux-target); height:var(--lux-target); display:grid; place-items:center; border-radius:50%; color:var(--ink2) }
.row[aria-current="true"] .t{ color:var(--accent); font-weight:650 }
:root[data-idiom="mac"] .row .lux-swipe-in{ border-radius:6px; padding:0 8px }
:root[data-idiom="mac"] .row:hover .lux-swipe-in{ background:rgb(255 255 255 / .05) }
:root[data-idiom="mac"] .row[aria-selected="true"] .lux-swipe-in{ background:var(--accent); color:#fff } :root[data-idiom="mac"] .row[aria-selected="true"] .d{ color:#fff }
.row + .row::before{ content:""; position:absolute; left:10px; right:0; top:0; height:1px; background:rgb(255 255 255 / .07); z-index:2 } /* list separators are a real list convention */
.sheet-detail .d-head canvas{ width:120px; height:120px }
.sheet-detail .d-head h2{ font-size:24px }
/* ---------- functional layer: phone ---------- */
.ph{ display:none } .mc{ display:none }
:root[data-idiom="phone"] .ph, :root[data-idiom="tablet"] .ph{ display:flex } :root[data-idiom="mac"] .mc{ display:flex }
.plus{ position:fixed; z-index:6; top:calc(12px + env(safe-area-inset-top,0px)); right:max(16px,env(safe-area-inset-right,0px)); width:48px; height:48px; border-radius:24px; overflow:hidden }
.plus .ico{ position:absolute; right:13px; top:13px }
.pmenu{ position:absolute; inset:0; padding:14px 8px 8px; opacity:0; pointer-events:none; display:grid; align-content:start; gap:2px }
.pmenu b{ font-size:13px; color:var(--ink2); font-weight:600; padding:0 12px 6px }
.pmenu button{ display:flex; align-items:center; gap:12px; height:44px; padding:0 12px; border-radius:14px; font-weight:600; text-align:left; white-space:nowrap }
.mini{ position:fixed; z-index:5; left:0; right:0; margin:0 auto; width:min(calc(100vw - 32px), max(33.333vw, 340px), 520px); bottom:calc(88px + env(safe-area-inset-bottom,0px)); height:62px; border-radius:31px; align-items:center; gap:12px; padding:0 10px 0 9px }
.art-dot{ width:44px; height:44px; border-radius:22px; background:var(--a,#ff5a7a); flex:none; position:relative } .art-dot::after{ content:""; position:absolute; inset:12px; border-radius:50%; background:var(--b,#ffd166) }
.mini .tx{ flex:1; min-width:0 } .mini b{ display:block; font-size:15px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis } .mini span{ font-size:13px; color:var(--lg-ink-2) }
.ppb{ width:44px; height:44px; border-radius:22px; display:grid; place-items:center }
.tabs{ position:fixed; z-index:5; left:0; right:0; margin:0 auto; width:min(calc(100vw - 32px), max(33.333vw, 340px), 520px); bottom:calc(14px + env(safe-area-inset-bottom,0px)); height:64px; border-radius:32px; padding:4px; touch-action:none }
.tab{ position:relative; z-index:1; flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px; font-size:10.5px; font-weight:650; border-radius:28px; color:var(--lg-ink-2, var(--ink2)) }
.tab[aria-current]{ color:var(--lg-tint, var(--accent)) }
.restsel{ position:absolute; z-index:0; top:4px; bottom:4px; border-radius:28px; background:rgb(255 255 255 / .14); pointer-events:none }
.lens{ position:absolute; z-index:0; pointer-events:none }
/* ---------- functional layer: Mac ---------- */
.side{ position:fixed; z-index:5; left:0; top:0; bottom:0; width:var(--sideW); flex-direction:column; gap:2px; padding:12px 10px; border-radius:0 }
.side .srch{ display:flex; align-items:center; gap:6px; height:28px; padding:0 8px; border-radius:7px; background:rgb(255 255 255 / .08); margin:2px 0 14px; color:var(--ink2) }
.side .srch input{ all:unset; flex:1; color:var(--ink); font-size:13px; min-width:0 }
.side .srch input:focus-visible{ outline:3px solid #8ec1ff; outline-offset:6px; border-radius:2px }
.side h3{ margin:14px 8px 4px; font-size:11px; font-weight:700; color:var(--ink2) }
.side a{ display:flex; align-items:center; gap:8px; height:28px; padding:0 8px; border-radius:7px; color:var(--ink); text-decoration:none; font-size:13px }
.side a .i{ color:var(--accent) }   /* macOS 27: sidebar icons keep their colour */
.side a[aria-current]{ background:rgb(255 255 255 / .12) }
.side a:hover{ background:rgb(255 255 255 / .06) }
.tbar{ position:fixed; z-index:5; top:0; left:var(--sideW); right:0; height:var(--barH); align-items:center; gap:10px; padding:0 12px; border-radius:0 }
.tbar .grp{ display:flex; gap:2px }
.tbar .tb{ width:30px; height:28px; border-radius:7px; display:grid; place-items:center }
.tbar .tb:hover:not([disabled]){ background:rgb(255 255 255 / .1) } .tbar .tb[disabled]{ opacity:.35; cursor:default }
.tbar .ttl{ font-weight:700; font-size:13px; flex:1 }
.np{ height:36px; width:min(380px, 40vw); border-radius:18px; background:rgb(255 255 255 / .08);   /* a toolbar item, not glass on glass */ display:flex; align-items:center; gap:10px; padding:0 6px; font-size:12px }
.np .art-dot{ width:26px; height:26px } .np .art-dot::after{ inset:7px }
.np .tx{ flex:1; min-width:0; line-height:1.2 } .np b{ display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis } .np span{ color:var(--ink2) }
.np .ppb{ width:28px; height:28px }
:root[data-idiom="mac"] #scrollc{ margin-left:var(--sideW) }
.hint{ position:absolute; z-index:4; left:16px; right:16px; top:118px; text-align:left; font-size:12px; color:#ffffffb0; pointer-events:none; transition:opacity .6s }
:root[data-idiom="mac"] .hint{ position:fixed; top:auto; bottom:18px; left:calc(var(--sideW) + 16px); text-align:center }
</style>
